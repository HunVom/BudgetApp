<h1>Budget App</h1>

<div>
  <label>Típus:</label>
  <select [(ngModel)]="type">
    <option value="income">Bevétel</option>
    <option value="expense">Kiadás</option>
  </select>
</div>

<div>
  <label>Összeg:</label>
  <input type="number" [(ngModel)]="amount">
</div>

<div>
  <label>Dátum:</label>
  <input type="date" [(ngModel)]="date">
</div>

<button (click)="save()">Mentés</button>

<hr>

<h2>Egyenleg</h2>
<p>{{ balance }} Ft</p>
